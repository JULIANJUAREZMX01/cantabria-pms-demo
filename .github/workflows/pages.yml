name: Deploy a GitHub Pages
on:
  push:
    branches: [main]   # incluye los commits de data.js / csv/ que hace Base44
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # demo = nada sale del navegador · legacy = escribe en Base44 (contrato actual)
      PUBLIC_GATEWAY_MODE: ${{ vars.GATEWAY_MODE || 'demo' }}
      PUBLIC_WRITE_API: ${{ vars.WRITE_API || 'https://kynic-os-ee9fcf0d.base44.app/functions/cantabriaWrite' }}
      PUBLIC_WRITE_TOKEN: ${{ secrets.CANTABRIA_WRITE_TOKEN || vars.CANTABRIA_WRITE_TOKEN }}
      PUBLIC_STAFF_PIN: ${{ secrets.CANTABRIA_STAFF_PIN || vars.CANTABRIA_STAFF_PIN }}
      PUBLIC_OWNER_PIN: ${{ secrets.CANTABRIA_OWNER_PIN || vars.CANTABRIA_OWNER_PIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Gate de superficie pública
        run: |
          set -euo pipefail
          if [ "${GATEWAY_MODE}" = "legacy" ] && [ -n "${CANTABRIA_WRITE_TOKEN}" ]; then
            echo "::error::GATEWAY_MODE=legacy incrustaría el token de escritura y los PIN en el bundle público."
            echo "::error::Usa GATEWAY_MODE=proxy (función de borde) o vacía CANTABRIA_WRITE_TOKEN / *_PIN antes de desplegar."
            echo "::error::Referencia: docs/adr y sección 6 del Estándar de arquitectura JAJA."
            exit 1
          fi
          echo "Superficie pública OK: modo=${GATEWAY_MODE:-demo}, sin secretos en el cliente."
        env:
          GATEWAY_MODE: ${{ vars.GATEWAY_MODE || 'demo' }}
          CANTABRIA_WRITE_TOKEN: ${{ secrets.CANTABRIA_WRITE_TOKEN || vars.CANTABRIA_WRITE_TOKEN }}
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
